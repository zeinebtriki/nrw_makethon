<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Command Center — Smart Warehouse</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .admin-nav {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .admin-view {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 36px;
            min-height: calc(100vh - 160px);
            animation: stage-in 0.3s ease;
        }

        .admin-view.is-active {
            display: block;
        }

        /* Grid View Styles */
        .rack-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .slot-card {
            background: var(--bg-main);
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            min-height: 125px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            transition: all 0.2s ease;
        }

        .slot-card.occupied-ready {
            border-color: var(--status-ready);
            background: var(--status-ready-bg);
        }

        .slot-card.occupied-drying {
            border-color: var(--status-drying);
            background: var(--status-drying-bg);
        }

        .slot-coord { font-size: 0.75rem; color: var(--text-muted); font-weight: 800; letter-spacing: 1px; }
        .slot-title { font-size: 0.95rem; font-weight: 800; color: var(--text-primary); margin: 4px 0; }
        .slot-qty { font-size: 1.1rem; font-weight: 800; }
        
        .status-badge { 
            font-size: 0.7rem; 
            border-radius: 6px; 
            padding: 4px 8px; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }
        .badge-ready { background: var(--status-ready); color: #000; }
        .badge-drying { background: var(--status-drying); color: #000; }
        .timing-info { font-size: 0.75rem; font-weight: 700; margin-top: 6px; line-height: 1.3; }

        /* Types View Styles */
        .types-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .type-card {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .type-photo-container {
            width: 100%;
            height: 180px; /* Increase this if you want a taller viewing area */
            background: var(--bg-hover);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .type-photo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Changes from 'cover' to 'contain' to show the full uncropped image */
            background: #000; /* Optional: adds a clean dark letterbox background if aspect ratios differ */
        }

        .type-photo-placeholder {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .type-stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .type-stat-row:last-child { border-bottom: none; padding-bottom: 0; }
        .stat-label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; }
        .stat-value { font-size: 0.95rem; color: var(--text-primary); font-weight: 800; }

        /* Form Styling */
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; max-width: 400px; }
        .form-label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; }
        .form-input {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }
        .form-input:focus { outline: none; border-color: var(--accent-orange); }
        .form-input[type="file"] { padding: 8px; font-size: 0.85rem; }
    </style>
</head>
<body class="terminal-body">

    <div class="dispatch-wrapper">
        <header class="terminal-header">
            <div>
                <a href="/" class="back-link">&larr; Terminal Select</a>
                <div class="terminal-tag" style="margin-top: 8px;"><span class="status-dot"></span> STATION 03 — ADMIN</div>
            </div>
            <div class="admin-nav">
                <button class="btn-ghost" onclick="switchView('grid')">View Grid</button>
                <button class="btn-ghost" onclick="switchView('types')">View Types</button>
                <button class="btn-primary" onclick="switchView('add')">+ Add New Type</button>
            </div>
        </header>

        <!-- VIEW: Grid -->
        <section id="view-grid" class="admin-view is-active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div>
                    <h2 class="panel-title">Stocking Area Grid</h2>
                    <p class="panel-sub">Real-time occupancy and FIFO tracking</p>
                </div>
            </div>
            <div id="rack-matrix-container" class="rack-grid"></div>
        </section>

        <!-- VIEW: Types -->
        <section id="view-types" class="admin-view">
            <h2 class="panel-title">Core Types Inventory</h2>
            <p class="panel-sub">Aggregated stock, specifications, and reference imagery</p>
            <div id="types-grid-container" class="types-grid"></div>
        </section>

        <!-- VIEW: Add Type (Functional) -->
        <section id="view-add" class="admin-view">
            <h2 class="panel-title">Register New Core Type</h2>
            <p class="panel-sub" style="margin-bottom: 24px;">Configure a new core profile for AI detection and scale calculations.</p>
            
            <form id="add-type-form" onsubmit="submitNewType(event)">
                <div class="form-group">
                    <label class="form-label">Core Type Name</label>
                    <input type="text" id="new_type_name" class="form-input" placeholder="e.g., Valve Body A" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Unit Weight (grams)</label>
                    <input type="number" step="0.01" id="new_unit_weight" class="form-input" placeholder="e.g., 250.5" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Reference Image (AI Training)</label>
                    <input type="file" id="new_type_image" class="form-input" accept="image/png, image/jpeg" required>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 10px;">Save Core Type</button>
            </form>
        </section>
    </div>

    <div id="toast" class="toast"></div>
    <script src="/static/admin.js"></script>
</body>
</html>
