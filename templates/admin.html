<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Central Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .admin-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        /* 5x5 Visual Grid Layout */
        .rack-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .slot-card {
            background: #0f172a;
            border: 2px dashed #334155;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            transition: all 0.3s ease;
        }

        /* State colors */
        .slot-card.occupied-ready {
            border: 2px solid #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .slot-card.occupied-drying {
            border: 2px solid #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }

        .slot-coord { font-size: 0.85rem; color: #64748b; font-weight: bold; }
        .slot-title { font-size: 0.95rem; font-weight: bold; color: #f8fafc; margin: 5px 0; }
        .slot-qty { font-size: 1.2rem; font-weight: bold; }
        .status-badge { font-size: 0.75rem; border-radius: 4px; padding: 2px 6px; font-weight: bold; }
        .badge-ready { background: #10b981; color: #022c22; }
        .badge-drying { background: #f59e0b; color: #451a03; }
        
        .legend { display: flex; gap: 20px; margin-top: 20px; }
        .legend-item { display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 0.9rem; }
        .legend-box { width: 14px; height: 14px; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="admin-container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>Warehouse Central Rack Matrix</h1>
                <p style="color: #94a3b8;">Real-Time 5x5 Physical Slot Occupancy</p>
            </div>
            <button onclick="fetchRackMatrix()" style="padding: 10px 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer;">↻ Refresh Grid</button>
        </header>

        <div class="legend">
            <div class="legend-item"><div class="legend-box" style="background: #10b981;"></div> Ready Stock (≥24h)</div>
            <div class="legend-item"><div class="legend-box" style="background: #f59e0b;"></div> Drying Stock (<24h)</div>
            <div class="legend-item"><div class="legend-box" style="border: 2px dashed #334155;"></div> Empty Slot</div>
        </div>

        <div id="rack-matrix-container" class="rack-grid"></div>
    </div>

    <script src="/static/admin.js"></script>
</body>
</html>
